name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        p5-version: [v1, v2]
    name: test (p5 ${{ matrix.p5-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run test:${{ matrix.p5-version }}

  node-test:
    runs-on: ubuntu-latest
    name: test (node, WebGL)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless-gl system deps
        run: |
          set -e
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" != "0" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq libgl1 libglu1-mesa libxi6 libxext6 libosmesa6 libglew2.2 xvfb
            else
              apt-get update -qq
              apt-get install -y -qq libgl1 libglu1-mesa libxi6 libxext6 libosmesa6 libglew2.2 xvfb
            fi
          fi
      - run: npm install
      - run: xvfb-run -a npm run test:webgl